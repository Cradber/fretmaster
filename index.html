<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">

    <!-- FIX iPHONE -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>FretMaster - Guitar Scales & Modes</title>

    <meta name="application-name" content="FretMaster">
    <meta name="apple-mobile-web-app-title" content="FretMaster">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* iPHONE FIX */
        .scroll-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* MOBILE FIRST */
        .fretboard-grid {
            display: grid;
            grid-template-columns: 32px repeat(22, minmax(32px, 1fr));
            width: max-content;
            min-width: 760px;
        }

        /* DESKTOP */
        @media (min-width: 768px) {
            .fretboard-grid {
                grid-template-columns: 40px repeat(22, minmax(42px, 1fr));
                min-width: 1050px;
            }
        }

        .string-row {
            position: relative;
            height: 44px;
        }

        .string-line {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            pointer-events: none;
        }

        .string-row:nth-child(1) .string-line { height: 1px; }
        .string-row:nth-child(2) .string-line { height: 1.5px; }
        .string-row:nth-child(3) .string-line { height: 2px; }
        .string-row:nth-child(4) .string-line { height: 2.5px; }
        .string-row:nth-child(5) .string-line { height: 3px; }
        .string-row:nth-child(6) .string-line { height: 3.5px; }

        .fret-cell {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .fret-dot {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .note-marker {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: 600;
            z-index: 30;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        @media (min-width: 768px) {
            .note-marker {
                width: 26px;
                height: 26px;
                font-size: 11px;
            }
        }

        .note-active {
            opacity: 1;
            transform: scale(1.05);
        }

        .note-dimmed {
            opacity: 0.15;
            transform: scale(0.75);
        }

        .role-root {
            background: #6366f1;
            color: white;
        }

        .role-third {
            background: #10b981;
            color: white;
        }

        .role-fifth {
            background: #f59e0b;
            color: white;
        }

        .role-seventh {
            background: #ec4899;
            color: white;
        }

        .dark .role-scale {
            background: #3f3f46;
            color: white;
        }

        html:not(.dark) .role-scale {
            background: #e4e4e7;
            color: black;
        }

        .ui-pill {
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        .dark .ui-pill {
            color: #a1a1aa;
        }

        .dark .ui-pill.active {
            background: white;
            color: black;
        }

        html:not(.dark) .ui-pill {
            color: #52525b;
        }

        html:not(.dark) .ui-pill.active {
            background: black;
            color: white;
        }

        .scale-pill {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }

        .dark .scale-pill.active {
            background: #18181b;
            color: white;
        }

        html:not(.dark) .scale-pill.active {
            background: white;
            color: black;
        }
    </style>
</head>

<body class="min-h-screen bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-50">

<div class="max-w-[1600px] mx-auto w-full p-4 sm:p-6 md:p-10">

    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">

        <div class="flex justify-between w-full sm:w-auto items-center">
            <h1 class="text-2xl font-light tracking-tight">
                Fret<span class="font-semibold">Master</span>
            </h1>

            <button id="theme-toggle"
                class="ml-4 p-2 rounded-full border border-zinc-300 dark:border-zinc-700">
                🌙
            </button>
        </div>
    </header>

    <div class="mb-8">

        <div class="flex md:hidden items-center justify-center gap-2 text-[10px] uppercase tracking-widest font-semibold text-zinc-500 mb-3">
            ← Desliza →
        </div>

        <div class="scroll-container no-scrollbar rounded-xl">

            <div class="fretboard-grid text-[10px] font-medium text-zinc-400 mb-2 text-center" id="fret-numbers"></div>

            <div class="bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-800 rounded-xl overflow-hidden shadow-sm"
                id="fretboard">
            </div>

        </div>
    </div>
</div>

<script>

const NUM_FRETS = 22;

const TUNING = ['E', 'B', 'G', 'D', 'A', 'E'];

const ALL_NOTES = [
    'C','C#','D','D#','E','F',
    'F#','G','G#','A','A#','B'
];

let currentRoot = 'C';

const SCALE = ['C','D','E','F','G','A','B'];

function initTheme() {

    const savedTheme = localStorage.getItem('theme');

    if(savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
    }

    document.getElementById('theme-toggle')
        .addEventListener('click', () => {

            document.documentElement.classList.toggle('dark');

            const isDark =
                document.documentElement.classList.contains('dark');

            localStorage.setItem(
                'theme',
                isDark ? 'dark' : 'light'
            );
        });
}

function getNoteAtFret(openNote, fret) {

    const start = ALL_NOTES.indexOf(openNote);

    return ALL_NOTES[(start + fret) % 12];
}

function createFretboard() {

    const fretboard =
        document.getElementById('fretboard');

    const fretNumbers =
        document.getElementById('fret-numbers');

    fretboard.innerHTML = '';
    fretNumbers.innerHTML = '';

    const empty = document.createElement('div');
    empty.textContent = ' ';
    fretNumbers.appendChild(empty);

    for(let i=0; i<=NUM_FRETS; i++) {

        const label = document.createElement('div');
        label.textContent = i;

        fretNumbers.appendChild(label);
    }

    TUNING.forEach((stringNote, stringIndex) => {

        const row = document.createElement('div');

        row.className =
            'fretboard-grid string-row group';

        const stringLine =
            document.createElement('div');

        stringLine.className =
            'string-line bg-zinc-400 dark:bg-zinc-600';

        row.appendChild(stringLine);

        for(let fret=0; fret<=NUM_FRETS; fret++) {

            const cell =
                document.createElement('div');

            cell.className =
                'fret-cell border-r border-zinc-200 dark:border-zinc-800';

            const note =
                getNoteAtFret(stringNote, fret);

            if(SCALE.includes(note)) {

                const noteDiv =
                    document.createElement('div');

                noteDiv.className =
                    note === currentRoot
                    ? 'note-marker role-root note-active'
                    : 'note-marker role-scale note-active';

                noteDiv.textContent = note;

                cell.appendChild(noteDiv);
            }

            row.appendChild(cell);
        }

        fretboard.appendChild(row);
    });
}

window.onload = () => {

    initTheme();
    createFretboard();
};

</script>

</body>
</html>
