<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FretMaster - Guitar Scales & Modes</title>

    <meta name="application-name" content="FretMaster">
    <meta name="apple-mobile-web-app-title" content="FretMaster">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">

    <!-- App Icons (Generados en SVG sin necesidad de archivos externos) -->

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .fretboard-grid {
            display: grid;
            grid-template-columns: 40px repeat(22, minmax(42px, 1fr));
            width: 100%;
            min-width: 1050px;
        }

        .string-row {
            position: relative;
            height: 44px;
        }

        /* String lines with dynamic thickness */
        .string-line {
            position: absolute;
            left: 0; right: 0; top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            pointer-events: none;
        }
        .string-row:nth-child(1) .string-line { height: 1px; }
        .string-row:nth-child(2) .string-line { height: 1.5px; }
        .string-row:nth-child(3) .string-line { height: 2px; }
        .string-row:nth-child(4) .string-line { height: 2.5px; }
        .string-row:nth-child(5) .string-line { height: 3px; }
        .string-row:nth-child(6) .string-line { height: 3.5px; }

        .fret-cell {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .fret-dot {
            position: absolute;
            width: 14px; height: 14px;
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .note-marker {
            width: 26px; height: 26px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            z-index: 30;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .note-active { opacity: 1; transform: scale(1.05); }
        .note-dimmed { opacity: 0.15; transform: scale(0.75); }

        /* Color Roles */
        .role-root { background-color: #6366f1; color: white; box-shadow: 0 0 15px rgba(99,102,241,0.5); }
        .role-third { background-color: #10b981; color: white; }
        .role-fifth { background-color: #f59e0b; color: white; }
        .role-seventh { background-color: #ec4899; color: white; }
        
        .dark .role-scale { background-color: #3f3f46; color: #f4f4f5; }
        html:not(.dark) .role-scale { background-color: #e4e4e7; color: #18181b; }

        .ui-pill {
            padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500;
            transition: all 0.2s; cursor: pointer; user-select: none;
        }
        .dark .ui-pill { color: #a1a1aa; }
        .dark .ui-pill:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .dark .ui-pill.active { background: #fff; color: #09090b; }
        
        html:not(.dark) .ui-pill { color: #52525b; }
        html:not(.dark) .ui-pill:hover { color: #09090b; background: rgba(0,0,0,0.05); }
        html:not(.dark) .ui-pill.active { background: #09090b; color: #fff; }

        .scale-pill {
            padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 500;
            transition: all 0.2s; cursor: pointer; border: 1px solid transparent;
        }
        .dark .scale-pill { color: #71717a; }
        .dark .scale-pill:hover { color: #d4d4d8; }
        .dark .scale-pill.active { background: #18181b; color: #e4e4e7; border-color: #27272a; }

        html:not(.dark) .scale-pill { color: #52525b; }
        html:not(.dark) .scale-pill:hover { color: #18181b; }
        html:not(.dark) .scale-pill.active { background: #fff; color: #09090b; border-color: #d4d4d8; box-shadow: 0 1px 2px rgba(0,0,0,0.05);}

        /* Theme Toggle SVG Icon handling */
        .sun-icon { display: none; }
        .moon-icon { display: block; }
        .dark .sun-icon { display: block; }
        .dark .moon-icon { display: none; }
    </style>
</head>

    <script>
        const NUM_FRETS = 22;
        const TUNING = ['E', 'B', 'G', 'D', 'A', 'E']; // 1st string to 6th string
        const ALL_NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        
        const INTERVAL_NAMES = {
            0: '1', 1: 'b2', 2: '2', 3: 'b3', 4: '3', 5: '4',
            6: '#4/b5', 7: '5', 8: 'b6', 9: '6', 10: 'b7', 11: '7'
        };

        const SCALES = {
            'major': { name: 'Mayor (Jónico)', type: 'basic', intervals: [0, 2, 4, 5, 7, 9, 11] },
            'minor': { name: 'Menor Natural', type: 'basic', intervals: [0, 2, 3, 5, 7, 8, 10] },
            'major_pentatonic': { name: 'Penta Mayor', type: 'penta', intervals: [0, 2, 4, 7, 9] },
            'minor_pentatonic': { name: 'Penta Menor', type: 'penta', intervals: [0, 3, 5, 7, 10] },
            'blues': { name: 'Blues', type: 'penta', intervals: [0, 3, 5, 6, 7, 10] },
            'dorian': { name: 'Dórico', type: 'mode', intervals: [0, 2, 3, 5, 7, 9, 10] },
            'phrygian': { name: 'Frigio', type: 'mode', intervals: [0, 1, 3, 5, 7, 8, 10] },
            'lydian': { name: 'Lidio', type: 'mode', intervals: [0, 2, 4, 6, 7, 9, 11] },
            'mixolydian': { name: 'Mixolidio', type: 'mode', intervals: [0, 2, 4, 5, 7, 9, 10] },
            'locrian': { name: 'Locrio', type: 'mode', intervals: [0, 1, 3, 5, 6, 8, 10] }
        };

        // CAGED System accurate fret spans for C Major (Start fret, end fret)
        // These window spans safely enclose all notes for the respective standard shapes.
        const BASE_POSITIONS_C = {
            'C': [0, 3],
            'A': [2, 5],
            'G': [4, 8],
            'E': [7, 10],
            'D': [9, 13]
        };

        let currentRoot = 'C';
        let currentScaleId = 'major';
        let currentPos = 'all';
        let displayMode = 'notes';

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            document.getElementById('theme-toggle').addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });
        }

        function getScaleNotes(root, scaleId) {
            const rootIdx = ALL_NOTES.indexOf(root);
            let scale = {};
            const intervals = SCALES[scaleId].intervals;

            intervals.forEach(interval => {
                const noteIdx = (rootIdx + interval) % 12;
                const noteName = ALL_NOTES[noteIdx];
                
                let role = 'role-scale';
                if (interval === 0) role = 'role-root';
                else if (interval === 3 || interval === 4) role = 'role-third';
                else if (interval === 7 || interval === 6) role = 'role-fifth'; // 6 included for locrian b5
                else if (interval === 10 || interval === 11) role = 'role-seventh';
                
                scale[noteName] = { role, noteText: noteName, intervalText: INTERVAL_NAMES[interval] };
            });
            return scale;
        }

        function getDynamicPositions(root) {
            const offset = (ALL_NOTES.indexOf(root) - ALL_NOTES.indexOf('C') + 12) % 12;
            let ranges = { 'all': [[0, NUM_FRETS]] };
            
            for (let shapeId in BASE_POSITIONS_C) {
                let start = BASE_POSITIONS_C[shapeId][0];
                let end = BASE_POSITIONS_C[shapeId][1];
                let span = end - start;
                
                // Shift the starting point based on the root note
                let shiftedStart = (start + offset) % 12;
                
                let physicalRanges = [];
                // Project this shape across all octaves of the fretboard
                for(let octaveStart = shiftedStart - 12; octaveStart <= NUM_FRETS; octaveStart += 12) {
                    if(octaveStart + span >= 0) {
                        physicalRanges.push([Math.max(0, octaveStart), octaveStart + span]);
                    }
                }
                ranges[shapeId] = physicalRanges;
            }
            return ranges;
        }

        function updateLegend() {
            const intervals = SCALES[currentScaleId].intervals;
            
            const thirdLegend = document.getElementById('legend-third');
            const thirdText = document.getElementById('legend-third-text');
            if (intervals.includes(4)) { thirdLegend.style.display = 'flex'; thirdText.textContent = '3ra Mayor'; }
            else if (intervals.includes(3)) { thirdLegend.style.display = 'flex'; thirdText.textContent = '3ra Menor (b3)'; }
            else thirdLegend.style.display = 'none';

            document.getElementById('legend-fifth').style.display = (intervals.includes(7) || intervals.includes(6)) ? 'flex' : 'none';

            const seventhLegend = document.getElementById('legend-seventh');
            const seventhText = document.getElementById('legend-seventh-text');
            if (intervals.includes(11)) { seventhLegend.style.display = 'flex'; seventhText.textContent = '7ma Mayor'; }
            else if (intervals.includes(10)) { seventhLegend.style.display = 'flex'; seventhText.textContent = '7ma Menor (b7)'; }
            else seventhLegend.style.display = 'none';
        }

        function renderKeySelector() {
            const container = document.getElementById('key-selector');
            ALL_NOTES.forEach(note => {
                const btn = document.createElement('div');
                btn.className = `ui-pill ${note === currentRoot ? 'active' : ''}`;
                btn.textContent = note;
                btn.dataset.key = note;
                
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('#key-selector .ui-pill').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentRoot = e.target.dataset.key;
                    document.getElementById('scale-root-text').textContent = currentRoot;
                    createFretboard();
                });
                container.appendChild(btn);
            });
        }

        function renderScaleSelector() {
            const container = document.getElementById('scale-selector');
            const groups = [
                { id: 'basic', title: 'Comunes', scales: [] },
                { id: 'penta', title: 'Pentatónicas', scales: [] },
                { id: 'mode', title: 'Modos Griegos', scales: [] }
            ];

            for (const [id, scale] of Object.entries(SCALES)) {
                groups.find(g => g.id === scale.type).scales.push({id, ...scale});
            }

            groups.forEach(group => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'flex flex-col sm:flex-row sm:flex-wrap gap-2 sm:items-center';
                
                const label = document.createElement('span');
                label.className = 'text-[10px] font-medium text-zinc-400 dark:text-zinc-600 uppercase sm:w-24 ml-1 sm:ml-0';
                label.textContent = group.title;
                groupDiv.appendChild(label);

                // Contenedor para que los botones de escala fluyan bien en móvil
                const pillsWrapper = document.createElement('div');
                pillsWrapper.className = 'flex flex-wrap gap-1.5 sm:gap-2';

                group.scales.forEach(scale => {
                    const btn = document.createElement('div');
                    btn.className = `scale-pill ${scale.id === currentScaleId ? 'active' : ''}`;
                    btn.textContent = scale.name;
                    btn.dataset.scale = scale.id;
                    
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.scale-pill').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        currentScaleId = e.target.dataset.scale;
                        document.getElementById('scale-name-text').textContent = SCALES[currentScaleId].name;
                        updateLegend();
                        createFretboard();
                    });
                    pillsWrapper.appendChild(btn);
                });
                
                groupDiv.appendChild(pillsWrapper);
                container.appendChild(groupDiv);
            });
        }

        function getNoteAtFret(stringOpenNote, fret) {
            const startIndex = ALL_NOTES.indexOf(stringOpenNote);
            return ALL_NOTES[(startIndex + fret) % 12];
        }

        function createFretboard() {
            const fretboard = document.getElementById('fretboard');
            const fretNumbers = document.getElementById('fret-numbers');
            
            fretboard.innerHTML = ''; fretNumbers.innerHTML = '';
            const currentScale = getScaleNotes(currentRoot, currentScaleId);

            // 1. Generate Fret Numbers Row
            const nutLabel = document.createElement('div');
            nutLabel.textContent = '0';
            fretNumbers.appendChild(nutLabel);
            for (let i = 1; i <= NUM_FRETS; i++) {
                const label = document.createElement('div');
                label.textContent = i;
                fretNumbers.appendChild(label);
            }

            // 2. Generate Strings and Frets
            TUNING.forEach((stringNote, stringIndex) => {
                const stringRow = document.createElement('div');
                stringRow.className = 'fretboard-grid string-row group';

                // The physical string line
                const stringLine = document.createElement('div');
                stringLine.className = 'string-line bg-zinc-400 dark:bg-zinc-600 group-hover:bg-zinc-500 dark:group-hover:bg-zinc-500 transition-colors';
                stringRow.appendChild(stringLine);

                for (let fret = 0; fret <= NUM_FRETS; fret++) {
                    const fretCell = document.createElement('div');
                    // Add borders to create fret wires. Nut (fret 0) is thicker.
                    let borderClass = fret === 0 
                        ? 'border-r-4 border-zinc-300 dark:border-zinc-700' 
                        : 'border-r border-zinc-200 dark:border-zinc-800';
                    
                    fretCell.className = `fret-cell ${borderClass}`;

                    // Inlays (Dots) - Painted carefully behind strings
                    const singleDotFrets = [3, 5, 7, 9, 15, 17, 19, 21];
                    if (stringIndex === 2 && singleDotFrets.includes(fret)) { // Between D and G string (visual center)
                        const marker = document.createElement('div');
                        marker.className = 'fret-dot bg-zinc-200 dark:bg-zinc-800/80';
                        marker.style.top = '100%'; // Offset to center between strings
                        fretCell.appendChild(marker);
                    } else if (fret === 12 || fret === 24) {
                        if (stringIndex === 1 || stringIndex === 3) {
                             const marker = document.createElement('div');
                             marker.className = 'fret-dot bg-zinc-200 dark:bg-zinc-800/80';
                             marker.style.top = '100%';
                             fretCell.appendChild(marker);
                        }
                    }

                    // Notes
                    const note = getNoteAtFret(stringNote, fret);

                    if (currentScale[note]) {
                        const noteData = currentScale[note];
                        const noteDiv = document.createElement('div');
                        noteDiv.className = `note-marker ${noteData.role}`;
                        noteDiv.textContent = displayMode === 'notes' ? noteData.noteText : noteData.intervalText;
                        noteDiv.dataset.fret = fret;
                        fretCell.appendChild(noteDiv);
                    }
                    stringRow.appendChild(fretCell);
                }
                fretboard.appendChild(stringRow);
            });
            
            highlightPosition(currentPos);
        }

        function highlightPosition(positionId) {
            currentPos = positionId;
            const dynamicPositions = getDynamicPositions(currentRoot);
            const ranges = dynamicPositions[positionId];
            const allNotes = document.querySelectorAll('.note-marker');

            allNotes.forEach(note => {
                const fret = parseInt(note.dataset.fret);
                let isActive = false;
                for(let r of ranges) {
                    if (fret >= r[0] && fret <= r[1]) { isActive = true; break; }
                }
                if (isActive) {
                     note.classList.add('note-active'); note.classList.remove('note-dimmed');
                } else {
                     note.classList.remove('note-active'); note.classList.add('note-dimmed');
                }
            });
        }

        function setupListeners() {
            // View Mode Toggles (Notas vs Intervalos)
            const btnNotes = document.getElementById('btn-notes');
            const btnIntervals = document.getElementById('btn-intervals');
            
            const setActiveBtn = (active, inactive) => {
                active.classList.add('bg-white', 'dark:bg-zinc-800', 'shadow-sm', 'text-zinc-900', 'dark:text-white');
                active.classList.remove('text-zinc-500', 'dark:text-zinc-400');
                inactive.classList.remove('bg-white', 'dark:bg-zinc-800', 'shadow-sm', 'text-zinc-900', 'dark:text-white');
                inactive.classList.add('text-zinc-500', 'dark:text-zinc-400');
            };

            btnNotes.addEventListener('click', () => {
                displayMode = 'notes';
                setActiveBtn(btnNotes, btnIntervals);
                createFretboard();
            });

            btnIntervals.addEventListener('click', () => {
                displayMode = 'intervals';
                setActiveBtn(btnIntervals, btnNotes);
                createFretboard();
            });

            // CAGED Segmented Control
            const cagedBtns = document.querySelectorAll('.caged-btn');
            cagedBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    cagedBtns.forEach(b => {
                        b.classList.remove('bg-white', 'dark:bg-zinc-800', 'shadow-sm', 'text-zinc-900', 'dark:text-white');
                        b.classList.add('text-zinc-500', 'dark:text-zinc-400');
                    });
                    
                    e.target.classList.add('bg-white', 'dark:bg-zinc-800', 'shadow-sm', 'text-zinc-900', 'dark:text-white');
                    e.target.classList.remove('text-zinc-500', 'dark:text-zinc-400');
                    
                    highlightPosition(e.target.dataset.pos);
                });
            });
        }

        window.onload = () => {
            initTheme();
            renderKeySelector();
            renderScaleSelector();
            updateLegend();
            createFretboard();
            setupListeners();
        };
    </script>
</body>
</html>
